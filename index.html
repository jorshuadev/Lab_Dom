<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripción al curso FISC</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <h1>Inscripción a curso de desarrollo en la FISC UTP</h1>
    <div id="contenedor">
      <form id="inscripcion" novalidate>
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input
            id="nombre"
            name="nombre"
            autocomplete="name"
            aria-describedby="nombre-error"
          />
          <p id="nombre-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="cedula">Cédula</label>
          <input
            id="cedula"
            name="cedula"
            placeholder="8-123-4567"
            aria-describedby="cedula-error"
          />
          <p id="cedula-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="correo">Correo</label>
          <input
            id="correo"
            name="correo"
            type="email"
            autocomplete="email"
            aria-describedby="correo-error"
          />
          <p id="correo-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="celular">Celular</label>
          <input
            id="celular"
            name="celular"
            type="tel"
            placeholder="6123-4567"
            aria-describedby="celular-error"
          />
          <p id="celular-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="nacimiento">Fecha de nacimiento</label>
          <input
            id="nacimiento"
            name="nacimiento"
            type="date"
            aria-describedby="nacimiento-error"
          />
          <p id="nacimiento-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="curso">Curso</label>
          <select id="curso" name="curso" aria-describedby="curso-error">
            <option value="">Selecciona un curso</option>
            <option>Ingeniería Web</option>
            <option>Bases de Datos</option>
            <option>Programación Orientada a Objetos</option>
            <option>Redes de Computadoras</option>
          </select>
          <p id="curso-error" class="error" aria-live="polite"></p>
        </div>

        <fieldset aria-describedby="modalidad-error">
          <legend>Modalidad</legend>
          <label
            ><input type="radio" name="modalidad" value="presencial" />
            Presencial</label
          >
          <label
            ><input type="radio" name="modalidad" value="virtual" />
            Virtual</label
          >
          <p id="modalidad-error" class="error" aria-live="polite"></p>
        </fieldset>

        <div class="campo" id="campo-sede" hidden>
          <label for="sede">Sede</label>
          <select id="sede" name="sede" aria-describedby="sede-error">
            <option value="">Selecciona una sede</option>
            <option>Ciudad de Panamá</option>
            <option>David</option>
            <option>Santiago</option>
          </select>
          <p id="sede-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="clave">Contraseña</label>
          <input
            id="clave"
            name="clave"
            type="password"
            autocomplete="new-password"
            aria-describedby="clave-error fuerza"
          />
          <p id="fuerza">Fuerza: -</p>
          <p id="clave-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="clave2">Confirmar contraseña</label>
          <input
            id="clave2"
            name="clave2"
            type="password"
            autocomplete="new-password"
            aria-describedby="clave2-error"
          />
          <p id="clave2-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="comentarios">Comentarios (opcional)</label>
          <textarea
            id="comentarios"
            name="comentarios"
            aria-describedby="comentarios-error contador"
          ></textarea>
          <p id="contador">0 / 200</p>
          <p id="comentarios-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label
            ><input
              type="checkbox"
              id="terminos"
              name="terminos"
              aria-describedby="terminos-error"
            />
            Acepto los términos</label
          >
          <p id="terminos-error" class="error" aria-live="polite"></p>
        </div>

        <button type="submit">Inscribirme</button>
      </form>

      <section id="confirmacion" aria-live="polite"></section>
    </div>

    <script src="validacion.js" defer></script>
  </body>
</html>
